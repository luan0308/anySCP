name: Release (Windows)

# Fork build: produces the Windows installers (.msi and .exe) with the
# anyscp-mcp server bundled next to the app, and attaches them to a GitHub
# release. Runs on a tag like v0.1.0, on every push to the `release` branch
# (as the version in package.json), or by hand from the Actions tab.

on:
  push:
    tags:
      - "v*"
    branches:
      - release
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 0.1.0)"
        required: true
        default: "0.1.0"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    name: Build Windows installer

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            anyscp-mcp -> target

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(jq -r .version package.json)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          jq --arg v "$VERSION" '.version = $v' package.json > tmp.json && mv tmp.json package.json
          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > tmp.json && mv tmp.json src-tauri/tauri.conf.json
          sed -i.bak "s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml && rm -f src-tauri/Cargo.toml.bak

      # The MCP server ships inside the installer as a Tauri sidecar, which
      # must be named with the target triple before bundling.
      - name: Build anyscp-mcp
        shell: bash
        run: |
          cargo build --release --manifest-path anyscp-mcp/Cargo.toml
          TRIPLE=$(rustc -vV | sed -n 's/host: //p')
          mkdir -p src-tauri/binaries
          cp anyscp-mcp/target/release/anyscp-mcp.exe "src-tauri/binaries/anyscp-mcp-$TRIPLE.exe"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --config src-tauri/tauri.release.conf.json
          tagName: v${{ steps.version.outputs.version }}
          releaseName: anySCP + FTP v${{ steps.version.outputs.version }}
          releaseBody: |
            Windows build with FTP/FTPS support and the anyscp-mcp server for Claude.

            Install with the .msi or the -setup.exe below, then open Settings > Claude and click Connect.
          releaseDraft: false
          prerelease: false
